services:
  narraworld:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: narraworld
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "false"
      PORT: "5002"
      WEB_CONCURRENCY: "1"
      GUNICORN_THREADS: "8"
      GUNICORN_TIMEOUT: "300"
      UPLOAD_FOLDER: /app/backend/uploads
      OASIS_SIMULATION_DATA_DIR: /app/backend/uploads/simulations
      FRONTEND_DIST_DIR: /app/frontend/dist
    ports:
      - "5002:5002"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
